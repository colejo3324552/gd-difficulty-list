<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-color: #121214;
            --surface-color: #1a1a1e;
            --text-color: #e2e8f0;
            --accent-color: #3b82f6;
            --active-color: #3b82f6;
            --border-color: #2d2d34;
            --header-bg: #1e1e24;
            --rank-badge-text: #f8fafc;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-color: #0f172a;
            --accent-color: #2563eb;
            --active-color: #2563eb;
            --border-color: #e2e8f0;
            --header-bg: #f1f5f9;
            --rank-badge-text: #0f172a;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input, select, button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
        }

        input[type="text"] {
            cursor: text;
            width: 200px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            height: calc(100vh - 70px);
        }

        .list-section {
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card.active {
            border-color: var(--active-color, var(--accent-color));
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .rank-badge {
            color: var(--rank-badge-text);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            min-width: 30px;
        }

        .thumb {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #000;
        }

        .info {
            flex-grow: 1;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .meta {
            font-size: 13px;
            opacity: 0.7;
        }

        .panel-section {
            border-left: 1px solid var(--border-color);
            background-color: var(--surface-color);
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-section img {
            width: 100%;
            border-radius: 8px;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .desc {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .panel-action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>

            <button onclick="toggleTheme()">🌓 Theme</button>

    </header>

        const levels = rawLevels.map((lvl, index) => ({
            ...lvl,
            r: index + 1
        }));

        let selectedId = null;

        function render() {
            const listEl = document.getElementById('list');
            const searchVal = document.getElementById('search').value.toLowerCase();
            const sortVal = document.getElementById('sort').value;

            let filtered = levels.filter(lvl => 
                lvl.n.toLowerCase().includes(searchVal) || 
                lvl.c.toLowerCase().includes(searchVal) ||
                lvl.v.toLowerCase().includes(searchVal)
            );

            if (sortVal === 'low-score') {
                filtered.sort((a, b) => a.s - b.s);
            } else if (sortVal === 'alphabetical') {
                filtered.sort((a, b) => a.n.localeCompare(b.n));
            } else {
                filtered.sort((a, b) => a.r - b.r);
            }

            listEl.innerHTML = '';
            filtered.forEach(lvl => {
                const card = document.createElement('div');
                card.className = `card ${selectedId === lvl.r ? 'active' : ''}`;
                card.onclick = () => selectLevel(lvl.r);

                const thumbUrl = lvl.videoId ? `https://img.youtube.com/vi/${lvl.videoId}/mqdefault.jpg` : 'https://via.placeholder.com/120x68?text=No+Video';

                card.innerHTML = `
                    <div class="rank-badge">#${lvl.r}</div>
                    <img class="thumb" src="${thumbUrl}" alt="${lvl.n}">
                    <div class="info">
                        <div class="name">${lvl.n}</div>
                        <div class="meta">by ${lvl.c} | Verified by ${lvl.v}</div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function selectLevel(rank) {
            selectedId = rank;
            render();
            const lvl = levels.find(l => l.r === rank);
            const panel = document.getElementById('panel');

            const thumbUrl = lvl.videoId ? `https://img.youtube.com/vi/${lvl.videoId}/hqdefault.jpg` : 'https://via.placeholder.com/400x225?text=No+Preview';
            const ytLink = lvl.videoId ? `https://www.youtube.com/watch?v=${lvl.videoId}` : '#';

            panel.innerHTML = `
                <div>
                    <span style="font-size: 14px; font-weight: bold; color: var(--accent-color);">RANK #${lvl.r}</span>
                    <h2 style="margin: 4px 0 0 0; font-size: 28px;">${lvl.n}</h2>
                    <div style="font-size: 14px; opacity: 0.8; margin-top: 4px;">Created by <b>${lvl.c}</b></div>
                    <div style="font-size: 14px; opacity: 0.8;">Verified by <b>${lvl.v}</b></div>
                </div>
                <img src="${thumbUrl}" alt="${lvl.n}">
                <div style="display: flex; gap: 15px; font-size: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                    <div><b>Score:</b> ${lvl.s}</div>
                </div>
                <div class="desc">${lvl.d}</div>

                ${lvl.videoId ? `<a href="${ytLink}" target="_blank" class="panel-action-btn">Watch Verification Video</a>` : ''}
            `;
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        }

        // Initialize rendering on load
        render();
